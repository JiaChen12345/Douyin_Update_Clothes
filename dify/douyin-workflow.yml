kind: app
version: 0.3.1
dependencies: []
app:
  name: 抖店原流程（无需视觉模型）
  mode: workflow
  icon: 🛍️
  icon_background: '#E4EEFF'
  use_icon_as_answer_icon: false
  description: 云端 Dify 编排本机 Playwright 的14个固定步骤；只保存草稿。演示和真实任务明确区分。
workflow:
  conversation_variables: []
  environment_variables:
  - id: c18bd046-1b72-566a-921f-d4dba147bdaa
    name: BROWSER_BASE_URL
    value_type: string
    value: https://your-browser-backend.example
    description: 填写云端可访问的 HTTPS 后端地址，不以斜杠结尾
  - id: 06c05eb8-6c56-55d3-bcc6-efb8e2fe8b8a
    name: BROWSER_API_KEY
    value_type: secret
    value: ''
    description: 复制本机 .env.dify.local 中的工具密钥，不是 Dify 的 API Key
  features:
    file_upload:
      enabled: false
    opening_statement: ''
    retriever_resource:
      enabled: false
    sensitive_word_avoidance:
      enabled: false
    speech_to_text:
      enabled: false
    suggested_questions: []
    suggested_questions_after_answer:
      enabled: false
    text_to_speech:
      enabled: false
  graph:
    nodes:
    - id: start
      type: custom
      width: 244
      height: 100
      position:
        x: 0
        y: 0
      positionAbsolute:
        x: 0
        y: 0
      sourcePosition: right
      targetPosition: left
      data:
        type: start
        title: 任务参数
        desc: ''
        selected: false
        variables:
        - variable: mode
          label: 运行模式：demo 演示 / live 真实草稿
          type: select
          options:
          - demo
          - live
          required: false
          default: demo
        - variable: source_url
          label: 供应商商品链接（真实任务必填）
          type: text-input
          max_length: 3000
          required: false
          options: []
        - variable: save_directory
          label: 本机素材保存目录（真实任务必填）
          type: text-input
          max_length: 1000
          required: false
          options: []
        - variable: resume_task_id
          label: 继续已有任务编号（新任务留空）
          type: text-input
          max_length: 32
          required: false
          options: []
        - variable: roi_json
          label: 可选目标区域 JSON（当前视口坐标）
          type: paragraph
          max_length: 1000
          required: false
          options: []
    - id: input
      type: custom
      width: 244
      height: 100
      position:
        x: 300
        y: 0
      positionAbsolute:
        x: 300
        y: 0
      sourcePosition: right
      targetPosition: left
      data:
        type: code
        title: 规范化参数
        desc: ''
        selected: false
        code_language: python3
        code: "import json, re, uuid\ndef main(mode: str, source_url: str, save_directory:\
          \ str, resume_task_id: str, roi_json: str) -> dict:\n    resume_task_id\
          \ = (resume_task_id or \"\").strip()\n    if resume_task_id:\n        if\
          \ not re.fullmatch(r\"[a-f0-9]{32}\", resume_task_id):\n            raise\
          \ ValueError(\"任务编号格式错误\")\n        return {\"path\": \"/tasks/\" + resume_task_id\
          \ + \"/resume\", \"body\": \"{}\"}\n    roi = json.loads(roi_json) if (roi_json\
          \ or \"\").strip() else None\n    payload = {\"request_id\": uuid.uuid4().hex,\
          \ \"platform\": \"抖店\", \"mode\": mode or \"demo\",\n               \"source_url\"\
          : source_url or \"\", \"save_directory\": save_directory or \"\",\n    \
          \           \"roi\": roi, \"vision_enabled\": False}\n    return {\"path\"\
          : \"/tasks\", \"body\": json.dumps(payload, ensure_ascii=False)}\n"
        variables:
        - variable: mode
          value_selector:
          - start
          - mode
          value_type: string
        - variable: source_url
          value_selector:
          - start
          - source_url
          value_type: string
        - variable: save_directory
          value_selector:
          - start
          - save_directory
          value_type: string
        - variable: resume_task_id
          value_selector:
          - start
          - resume_task_id
          value_type: string
        - variable: roi_json
          value_selector:
          - start
          - roi_json
          value_type: string
        outputs:
          path:
            type: string
            children: null
          body:
            type: string
            children: null
    - id: create
      type: custom
      width: 244
      height: 100
      position:
        x: 600
        y: 0
      positionAbsolute:
        x: 600
        y: 0
      sourcePosition: right
      targetPosition: left
      data:
        type: http-request
        title: 创建或继续本机任务
        desc: ''
        selected: false
        method: POST
        url: '{{#env.BROWSER_BASE_URL#}}{{#input.path#}}'
        authorization:
          type: no-auth
        params: ''
        headers: 'X-Browser-Key: {{#env.BROWSER_API_KEY#}}

          Content-Type: application/json'
        body:
          type: json
          data:
          - id: 84f50b77a3e24789aae3b3c8fee7f64c
            key: ''
            type: text
            value: '{{#input.body#}}'
        timeout:
          connect: 10
          read: 25
          write: 15
        ssl_verify: true
        retry_config:
          retry_enabled: false
          enabled: false
          max_retries: 0
          retry_interval: 1000
    - id: task
      type: custom
      width: 244
      height: 100
      position:
        x: 900
        y: 0
      positionAbsolute:
        x: 900
        y: 0
      sourcePosition: right
      targetPosition: left
      data:
        type: code
        title: 读取任务编号
        desc: ''
        selected: false
        code_language: python3
        code: "import json, re\ndef main(body: str, status_code: int) -> dict:\n \
          \   data = json.loads(body)\n    if status_code != 200 or not re.fullmatch(r\"\
          [a-f0-9]{32}\", data.get(\"task_id\", \"\")):\n        raise ValueError(\"\
          本机工具拒绝任务：\" + str(data))\n    return {\"task_id\": data[\"task_id\"]}\n"
        variables:
        - variable: body
          value_selector:
          - create
          - body
          value_type: string
        - variable: status_code
          value_selector:
          - create
          - status_code
          value_type: number
        outputs:
          task_id:
            type: string
            children: null
    - id: loop
      type: custom
      width: 2500
      height: 900
      position:
        x: 1200
        y: 0
      positionAbsolute:
        x: 1200
        y: 0
      sourcePosition: right
      targetPosition: left
      data:
        type: loop
        title: 按原步骤执行并处理暂停
        desc: ''
        selected: false
        loop_count: 180
        start_node_id: loop-start
        logical_operator: and
        break_conditions:
        - id: done-condition
          variable_selector:
          - loop
          - done
          comparison_operator: ≥
          varType: number
          value: '1'
        loop_variables:
        - id: done-var
          label: done
          var_type: number
          value_type: constant
          value: '0'
        - id: report-var
          label: report
          var_type: string
          value_type: constant
          value: '{}'
        width: 2500
        height: 900
      zIndex: 1
    - id: loop-start
      type: custom-loop-start
      width: 44
      height: 48
      position:
        x: 30
        y: 80
      positionAbsolute:
        x: 1230
        y: 80
      sourcePosition: right
      targetPosition: left
      data:
        type: loop-start
        title: ''
        desc: ''
        selected: false
        isInLoop: true
        isInIteration: false
        loop_id: loop
      parentId: loop
      zIndex: 1002
      draggable: false
      selectable: false
    - id: poll
      type: custom
      width: 244
      height: 100
      position:
        x: 120
        y: 80
      positionAbsolute:
        x: 1320
        y: 80
      sourcePosition: right
      targetPosition: left
      data:
        type: http-request
        title: 读取当前步骤结果
        desc: ''
        selected: false
        method: GET
        url: '{{#env.BROWSER_BASE_URL#}}/tasks/{{#task.task_id#}}?wait_seconds=15'
        authorization:
          type: no-auth
        params: ''
        headers: 'X-Browser-Key: {{#env.BROWSER_API_KEY#}}

          Content-Type: application/json'
        body:
          type: none
          data: []
        timeout:
          connect: 10
          read: 25
          write: 15
        ssl_verify: true
        retry_config:
          retry_enabled: false
          enabled: false
          max_retries: 0
          retry_interval: 1000
        isInLoop: true
        isInIteration: false
        loop_id: loop
      parentId: loop
      zIndex: 1002
    - id: state
      type: custom
      width: 244
      height: 100
      position:
        x: 430
        y: 80
      positionAbsolute:
        x: 1630
        y: 80
      sourcePosition: right
      targetPosition: left
      data:
        type: code
        title: 判断固定流程状态
        desc: ''
        selected: false
        code_language: python3
        code: "import json\ndef main(body: str, status_code: int) -> dict:\n    if\
          \ status_code != 200:\n        raise ValueError(\"无法读取本机任务，请检查后端地址及密钥\"\
          )\n    data = json.loads(body)\n    state = data.get(\"status\")\n    if\
          \ state == \"IDLE\": action = \"advance\"\n    elif state == \"RUNNING\"\
          : action = \"wait\"\n    elif state == \"NEEDS_VISION\" and False: action\
          \ = \"vision\"\n    else: action = \"stop\"\n    info = data.get(\"vision\"\
          , {})\n    return {\"action\": action, \"stage_body\": json.dumps({\"stage\"\
          : data.get(\"next_stage\", \"\")}),\n            \"screenshot_id\": info.get(\"\
          screenshot_id\", \"\"), \"target\": info.get(\"target\", \"\"),\n      \
          \      \"width\": info.get(\"width\", 0), \"height\": info.get(\"height\"\
          , 0)}\n"
        variables:
        - variable: body
          value_selector:
          - poll
          - body
          value_type: string
        - variable: status_code
          value_selector:
          - poll
          - status_code
          value_type: number
        outputs:
          action:
            type: string
            children: null
          stage_body:
            type: string
            children: null
          screenshot_id:
            type: string
            children: null
          target:
            type: string
            children: null
          width:
            type: number
            children: null
          height:
            type: number
            children: null
        isInLoop: true
        isInIteration: false
        loop_id: loop
      parentId: loop
      zIndex: 1002
    - id: branch
      type: custom
      width: 244
      height: 100
      position:
        x: 740
        y: 80
      positionAbsolute:
        x: 1940
        y: 80
      sourcePosition: right
      targetPosition: left
      data:
        type: if-else
        title: 执行 / 视觉 / 人工或完成
        desc: ''
        selected: false
        cases:
        - id: advance
          case_id: advance
          logical_operator: and
          conditions:
          - id: advance-condition
            variable_selector:
            - state
            - action
            comparison_operator: is
            varType: string
            value: advance
        - id: stop
          case_id: stop
          logical_operator: and
          conditions:
          - id: stop-condition
            variable_selector:
            - state
            - action
            comparison_operator: is
            varType: string
            value: stop
        isInLoop: true
        isInIteration: false
        loop_id: loop
      parentId: loop
      zIndex: 1002
    - id: advance
      type: custom
      width: 244
      height: 100
      position:
        x: 1060
        y: 20
      positionAbsolute:
        x: 2260
        y: 20
      sourcePosition: right
      targetPosition: left
      data:
        type: http-request
        title: 执行明确的下一个步骤
        desc: ''
        selected: false
        method: POST
        url: '{{#env.BROWSER_BASE_URL#}}/tasks/{{#task.task_id#}}/advance'
        authorization:
          type: no-auth
        params: ''
        headers: 'X-Browser-Key: {{#env.BROWSER_API_KEY#}}

          Content-Type: application/json'
        body:
          type: json
          data:
          - id: efb334463dbe48878fc077fe945e3dd0
            key: ''
            type: text
            value: '{{#state.stage_body#}}'
        timeout:
          connect: 10
          read: 25
          write: 15
        ssl_verify: true
        retry_config:
          retry_enabled: false
          enabled: false
          max_retries: 0
          retry_interval: 1000
        isInLoop: true
        isInIteration: false
        loop_id: loop
      parentId: loop
      zIndex: 1002
    - id: continued
      type: custom
      width: 244
      height: 100
      position:
        x: 2130
        y: 80
      positionAbsolute:
        x: 3330
        y: 80
      sourcePosition: right
      targetPosition: left
      data:
        type: assigner
        title: 继续下一轮
        desc: ''
        selected: false
        version: '2'
        items:
        - input_type: constant
          operation: over-write
          value: 0
          variable_selector:
          - loop
          - done
          write_mode: over-write
        - input_type: variable
          operation: over-write
          value:
          - poll
          - body
          variable_selector:
          - loop
          - report
          write_mode: over-write
        isInLoop: true
        isInIteration: false
        loop_id: loop
      parentId: loop
      zIndex: 1002
    - id: stopped
      type: custom
      width: 244
      height: 100
      position:
        x: 1060
        y: 560
      positionAbsolute:
        x: 2260
        y: 560
      sourcePosition: right
      targetPosition: left
      data:
        type: assigner
        title: 结束本轮
        desc: ''
        selected: false
        version: '2'
        items:
        - input_type: constant
          operation: over-write
          value: 1
          variable_selector:
          - loop
          - done
          write_mode: over-write
        - input_type: variable
          operation: over-write
          value:
          - poll
          - body
          variable_selector:
          - loop
          - report
          write_mode: over-write
        isInLoop: true
        isInIteration: false
        loop_id: loop
      parentId: loop
      zIndex: 1002
    - id: final
      type: custom
      width: 244
      height: 100
      position:
        x: 3800
        y: 0
      positionAbsolute:
        x: 3800
        y: 0
      sourcePosition: right
      targetPosition: left
      data:
        type: code
        title: 输出真实状态与本机文件结果
        desc: ''
        selected: false
        code_language: python3
        code: "import json\ndef main(report: str) -> dict:\n    data = json.loads(report\
          \ or \"{}\")\n    state = data.get(\"status\", \"UNKNOWN\")\n    simulation\
          \ = bool(data.get(\"simulation\", True))\n    message = data.get(\"message\"\
          , \"尚未取得任务结果\")\n    if state in (\"IDLE\", \"RUNNING\"):\n        message\
          \ = \"本次云端轮询结束，后端任务仍可查询；用任务编号继续，不能重复新建。\"\n    prefix = \"【本地演示，无真实商品】\"\
          \ if simulation else \"【真实商品，仅保存草稿】\"\n    return {\"task_id\": data.get(\"\
          task_id\", \"\"), \"status\": state,\n            \"summary\": prefix +\
          \ message, \"result_json\": report}\n"
        variables:
        - variable: report
          value_selector:
          - loop
          - report
          value_type: string
        outputs:
          task_id:
            type: string
            children: null
          status:
            type: string
            children: null
          summary:
            type: string
            children: null
          result_json:
            type: string
            children: null
    - id: end
      type: custom
      width: 244
      height: 100
      position:
        x: 4100
        y: 0
      positionAbsolute:
        x: 4100
        y: 0
      sourcePosition: right
      targetPosition: left
      data:
        type: end
        title: 结果
        desc: ''
        selected: false
        outputs:
        - variable: task_id
          value_selector:
          - final
          - task_id
          value_type: string
        - variable: status
          value_selector:
          - final
          - status
          value_type: string
        - variable: summary
          value_selector:
          - final
          - summary
          value_type: string
        - variable: result_json
          value_selector:
          - final
          - result_json
          value_type: string
    edges:
    - id: start-source-input
      source: start
      sourceHandle: source
      target: input
      targetHandle: target
      type: custom
      zIndex: 0
      data:
        sourceType: start
        targetType: code
        isInIteration: false
        isInLoop: false
    - id: input-source-create
      source: input
      sourceHandle: source
      target: create
      targetHandle: target
      type: custom
      zIndex: 0
      data:
        sourceType: code
        targetType: http-request
        isInIteration: false
        isInLoop: false
    - id: create-source-task
      source: create
      sourceHandle: source
      target: task
      targetHandle: target
      type: custom
      zIndex: 0
      data:
        sourceType: http-request
        targetType: code
        isInIteration: false
        isInLoop: false
    - id: task-source-loop
      source: task
      sourceHandle: source
      target: loop
      targetHandle: target
      type: custom
      zIndex: 0
      data:
        sourceType: code
        targetType: loop
        isInIteration: false
        isInLoop: false
    - id: loop-start-source-poll
      source: loop-start
      sourceHandle: source
      target: poll
      targetHandle: target
      type: custom
      zIndex: 1002
      data:
        sourceType: loop-start
        targetType: http-request
        isInIteration: false
        isInLoop: true
        loop_id: loop
    - id: poll-source-state
      source: poll
      sourceHandle: source
      target: state
      targetHandle: target
      type: custom
      zIndex: 1002
      data:
        sourceType: http-request
        targetType: code
        isInIteration: false
        isInLoop: true
        loop_id: loop
    - id: state-source-branch
      source: state
      sourceHandle: source
      target: branch
      targetHandle: target
      type: custom
      zIndex: 1002
      data:
        sourceType: code
        targetType: if-else
        isInIteration: false
        isInLoop: true
        loop_id: loop
    - id: advance-source-continued
      source: advance
      sourceHandle: source
      target: continued
      targetHandle: target
      type: custom
      zIndex: 1002
      data:
        sourceType: http-request
        targetType: assigner
        isInIteration: false
        isInLoop: true
        loop_id: loop
    - id: branch-advance-advance
      source: branch
      sourceHandle: advance
      target: advance
      targetHandle: target
      type: custom
      zIndex: 1002
      data:
        sourceType: if-else
        targetType: http-request
        isInIteration: false
        isInLoop: true
        loop_id: loop
    - id: branch-stop-stopped
      source: branch
      sourceHandle: stop
      target: stopped
      targetHandle: target
      type: custom
      zIndex: 1002
      data:
        sourceType: if-else
        targetType: assigner
        isInIteration: false
        isInLoop: true
        loop_id: loop
    - id: branch-false-continued
      source: branch
      sourceHandle: 'false'
      target: continued
      targetHandle: target
      type: custom
      zIndex: 1002
      data:
        sourceType: if-else
        targetType: assigner
        isInIteration: false
        isInLoop: true
        loop_id: loop
    - id: loop-source-final
      source: loop
      sourceHandle: source
      target: final
      targetHandle: target
      type: custom
      zIndex: 0
      data:
        sourceType: loop
        targetType: code
        isInIteration: false
        isInLoop: false
    - id: final-source-end
      source: final
      sourceHandle: source
      target: end
      targetHandle: target
      type: custom
      zIndex: 0
      data:
        sourceType: code
        targetType: end
        isInIteration: false
        isInLoop: false
    viewport:
      x: 0
      y: 100
      zoom: 0.55
